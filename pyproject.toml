[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocore-agent"
version = "1.1.0"
description = "Autonomous AI Coding & Daily Productivity Assistant"
authors = [{ name = "NeuroCore Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.40",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
neurocore = "neurocore.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurocore*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
